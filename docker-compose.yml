version: "3.9"

services:
  api:
    build: .
    container_name: hrms-api
    restart: unless-stopped
    ports:
      - "5005:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/hrms_dev
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=dev_refresh_secret
      - JWT_REFRESH_EXPIRES_IN=30d
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mongo
      - redis
    networks:
      - hrms-network

  mongo:
    image: mongo:7
    container_name: hrms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - hrms-network

  redis:
    image: redis:7-alpine
    container_name: hrms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hrms-network

volumes:
  mongo-data:
  redis-data:

networks:
  hrms-network:
    driver: bridge